# Railway.app deployment configuration
# https://docs.railway.app/reference/nixpacks

[build]
builder = "nixpacks"

[[services]]
name = "drowsy-api"
up = ["python -m uvicorn main:app --host 0.0.0.0 --port 8000"]
plan = "starter"

[services.env]
PYTHON_VERSION = "3.11"
PORT = "8000"
ENVIRONMENT = "production"

[[services.volumes]]
mount_path = "/app/logs"
size_gb = 1
